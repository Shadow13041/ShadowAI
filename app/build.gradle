plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.shadowai.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.shadowai.app'
        minSdk 19
        targetSdk 28
        versionCode 11
        versionName '1.10.0'
    }
    flavorDimensions 'inference'
    productFlavors {
        universal { dimension 'inference'; minSdk 19 }
        localAi { dimension 'inference'; minSdk 24; ndk { abiFilters 'arm64-v8a' } }
    }

    buildFeatures {
        buildConfig true
    }

    kotlinOptions { jvmTarget = '1.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    localAiImplementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    localAiImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
